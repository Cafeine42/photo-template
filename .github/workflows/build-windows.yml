name: Build Windows

# Builds native Windows installers (.msi / .exe) on an actual windows-latest
# GitHub runner (no cross-compilation from Linux). Artifacts are uploaded to
# the workflow run only — nothing is published as a public GitHub Release.
# Download them from the run's "Summary" page under "Artifacts".

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (uses the Yarn version pinned in package.json)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build Tauri app
        run: yarn tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: photo-template-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
